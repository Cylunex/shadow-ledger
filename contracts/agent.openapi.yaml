openapi: 3.1.0
info:
  title: Shadow Ledger Agent API
  version: 1.0.0
servers:
  - url: https://ledger.example.com
paths:
  /api/machine/v1/agent/nexus/commands:
    post:
      operationId: execute_nexus_ledger_command
      summary: Commit one ordinary private Ledger record under the current user intent
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Strict execution receipt for the committed Ledger record
          content:
            application/json:
              schema: { type: object }
  /api/machine/v1/agent/summary:
    get:
      operationId: get_agent_summary
      summary: Get a monthly financial summary from the granted Ledger workspace
      parameters:
        - $ref: "#/components/parameters/Month"
        - $ref: "#/components/parameters/Currency"
      responses:
        "200":
          description: Monthly summary without account or payment data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentSummary"
  /api/machine/v1/agent/records:
    get:
      operationId: list_agent_records
      summary: List minimally disclosed confirmed records from the granted Ledger workspace
      parameters:
        - $ref: "#/components/parameters/Month"
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 25 }
        - name: payment_method
          in: query
          required: false
          schema: { $ref: "#/components/schemas/PaymentMethod" }
      responses:
        "200":
          description: Bounded confirmed record facts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRecordList"
  /api/machine/v1/agent/budgets:
    get:
      operationId: list_agent_budgets
      summary: List monthly budget progress from the granted Ledger workspace
      parameters:
        - $ref: "#/components/parameters/Month"
      responses:
        "200":
          description: Budget targets and progress grouped by their stored currency
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentBudgetList"
  /api/machine/v1/agent/drafts:
    get:
      operationId: list_agent_record_drafts
      summary: List pending drafts created by the same Agent for Nexus review
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 200 }
      responses:
        "200":
          description: Pending Agent drafts with the fields needed for review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRecordDraftList"
    post:
      operationId: create_agent_record_draft
      summary: Create a reversible money record draft for later user confirmation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentRecordDraftCreate"
      responses:
        "201":
          description: Reversible pending Ledger record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRecordDraftCreated"
  /api/machine/v1/agent/drafts/{record_id}/commit:
    post:
      operationId: commit_agent_record_draft
      summary: Commit an Agent-created draft after explicit user review
      parameters:
        - name: record_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentRecordDraftCommit"
      responses:
        "200":
          description: Confirmed Ledger record, including idempotent replay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRecordCommitted"
  /api/machine/v1/agent/drafts/{record_id}/reject:
    post:
      operationId: reject_agent_record_draft
      summary: Delete an Agent-created draft rejected in Nexus review
      parameters:
        - name: record_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentRecordDraftCommit"
      responses:
        "200":
          description: Rejected draft receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRecordRejected"
  /api/machine/v1/agent/nexus/reviews:
    get:
      operationId: list_nexus_ledger_reviews
      responses:
        "200":
          description: Normalized Ledger review queue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NexusReviewList" }
    post:
      operationId: create_nexus_ledger_review
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NexusReviewCreate" }
      responses:
        "201":
          description: Normalized Ledger review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NexusReview" }
  /api/machine/v1/agent/nexus/reviews/{review_id}/commit:
    post:
      operationId: commit_nexus_ledger_review
      parameters:
        - $ref: "#/components/parameters/ReviewId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentRecordDraftCommit" }
      responses:
        "200":
          description: Committed normalized Ledger review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NexusReview" }
  /api/machine/v1/agent/nexus/reviews/{review_id}/reject:
    post:
      operationId: reject_nexus_ledger_review
      parameters:
        - $ref: "#/components/parameters/ReviewId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentRecordDraftCommit" }
      responses:
        "200":
          description: Rejected normalized Ledger review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NexusReview" }
components:
  parameters:
    ReviewId:
      name: review_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Month:
      name: month
      in: query
      required: false
      schema:
        type: string
        pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
    Currency:
      name: currency
      in: query
      required: false
      schema:
        type: string
        pattern: "^[A-Za-z]{3}$"
        default: CNY
  schemas:
    NexusReviewCreate:
      type: object
      additionalProperties: false
      required: [intent, summary, fields]
      properties:
        intent: { type: string }
        summary: { type: string, maxLength: 500 }
        fields: { type: object, additionalProperties: true }
        source_text: { type: string, maxLength: 4000 }
        source_refs:
          type: array
          maxItems: 16
          items: { type: string }
    NexusReview:
      type: object
      additionalProperties: false
      required: [protocol, review_id, reference, revision, domain, intent, summary, fields, risk_level, state, created_at, source_refs, trace_id, receipt, replayed]
      properties:
        protocol: { const: shadow.review.v1 }
        review_id: { type: string, format: uuid }
        reference: { type: string }
        revision: { type: integer }
        domain: { const: ledger }
        intent: { type: string }
        summary: { type: string }
        fields: { type: object, additionalProperties: true }
        risk_level: { const: L2 }
        state: { enum: [pending, committed, rejected] }
        created_at: { type: string, format: date-time }
        source_refs: { type: array, items: { type: string } }
        trace_id: { type: string }
        receipt:
          anyOf:
            - { type: string }
            - { type: "null" }
        replayed: { type: boolean }
    NexusReviewList:
      type: object
      additionalProperties: true
      required: [protocol, items, truncated, trace_id]
      properties:
        protocol: { const: shadow.review.v1 }
        items:
          type: array
          items: { $ref: "#/components/schemas/NexusReview" }
        truncated: { type: boolean }
        trace_id: { type: string }
    MoneyValue:
      type: string
      pattern: "^-?[0-9]+(?:\\.[0-9]{1,4})?$"
    OptionalString:
      anyOf:
        - { type: string }
        - { type: "null" }
    OptionalMoneyValue:
      anyOf:
        - $ref: "#/components/schemas/MoneyValue"
        - { type: "null" }
    AgentSummary:
      type: object
      additionalProperties: false
      required:
        - month
        - currency
        - expense
        - income
        - refund
        - net_spending
        - generated_at
        - exchange_rate_applied
      properties:
        month: { type: string }
        currency: { type: string }
        expense: { $ref: "#/components/schemas/MoneyValue" }
        income: { $ref: "#/components/schemas/MoneyValue" }
        refund: { $ref: "#/components/schemas/MoneyValue" }
        net_spending: { $ref: "#/components/schemas/MoneyValue" }
        generated_at: { type: string, format: date-time }
        exchange_rate_applied: { const: false }
    PaymentMethod:
      anyOf:
        - enum: [alipay, wechat, jd_pay, jd_baitiao, huabei, gift_card, cash, bank_card, bank_transfer, mixed, other]
        - type: "null"
    AgentRecordSummary:
      type: object
      additionalProperties: false
      required:
        - record_ref
        - occurred_at
        - record_kind
        - money_type
        - amount
        - currency
        - category_key
        - scene
      properties:
        record_ref:
          type: string
          pattern: "^shadow://ledger/records/"
        occurred_at: { type: string, format: date-time }
        record_kind: { enum: [money_only, consumption] }
        money_type:
          anyOf:
            - { enum: [expense, income, refund] }
            - { type: "null" }
        amount: { $ref: "#/components/schemas/OptionalMoneyValue" }
        currency: { $ref: "#/components/schemas/OptionalString" }
        category_key: { $ref: "#/components/schemas/OptionalString" }
        scene: { $ref: "#/components/schemas/OptionalString" }
        payment_method: { $ref: "#/components/schemas/PaymentMethod" }
    AgentRecordList:
      type: object
      additionalProperties: false
      required: [month, items, truncated]
      properties:
        month: { type: string }
        items:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/AgentRecordSummary"
        truncated: { type: boolean }
    AgentBudgetSummary:
      type: object
      additionalProperties: false
      required:
        - budget_ref
        - category_key
        - monthly_amount
        - currency
        - net_spending
        - remaining
      properties:
        budget_ref:
          type: string
          pattern: "^shadow://ledger/budget-targets/"
        category_key: { $ref: "#/components/schemas/OptionalString" }
        monthly_amount: { $ref: "#/components/schemas/MoneyValue" }
        currency: { type: string }
        net_spending: { $ref: "#/components/schemas/MoneyValue" }
        remaining: { $ref: "#/components/schemas/MoneyValue" }
    AgentBudgetList:
      type: object
      additionalProperties: false
      required: [month, items, unknown_amount_records, exchange_rate_applied]
      properties:
        month: { type: string }
        items:
          type: array
          items:
            $ref: "#/components/schemas/AgentBudgetSummary"
        unknown_amount_records: { type: integer, minimum: 0 }
        exchange_rate_applied: { const: false }
    AgentRecordDraftCreate:
      type: object
      additionalProperties: false
      required: [occurred_at, money_type, amount, currency]
      properties:
        occurred_at: { type: string, format: date-time }
        timezone: { type: string, minLength: 1, maxLength: 64, default: Asia/Shanghai }
        money_type: { enum: [expense, income, refund] }
        amount:
          type: string
          pattern: "^[0-9]+(?:\\.[0-9]{1,4})?$"
        currency:
          type: string
          pattern: "^[A-Za-z]{3}$"
        category_key:
          anyOf:
            - { type: string, pattern: "^[a-z][a-z0-9_-]{0,49}$" }
            - { type: "null" }
        title: { type: string, maxLength: 160, default: "" }
        payment_method: { $ref: "#/components/schemas/PaymentMethod" }
    AgentRecordDraftCreated:
      type: object
      additionalProperties: false
      required: [record_ref, state, revision, reversible, final_entry_created]
      properties:
        record_ref:
          type: string
          pattern: "^shadow://ledger/records/"
        state: { const: draft }
        revision: { type: integer, minimum: 1 }
        reversible: { const: true }
        final_entry_created: { const: false }
    AgentRecordDraftSummary:
      type: object
      additionalProperties: false
      required: [record_ref, revision, created_at, occurred_at, money_type, amount, currency, category_key, title]
      properties:
        record_ref: { type: string, pattern: "^shadow://ledger/records/" }
        revision: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        occurred_at: { type: string, format: date-time }
        money_type:
          anyOf:
            - { enum: [expense, income, refund] }
            - { type: "null" }
        amount: { $ref: "#/components/schemas/OptionalMoneyValue" }
        currency: { $ref: "#/components/schemas/OptionalString" }
        category_key: { $ref: "#/components/schemas/OptionalString" }
        title: { type: string }
    AgentRecordDraftList:
      type: object
      additionalProperties: false
      required: [items, truncated]
      properties:
        items:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/AgentRecordDraftSummary" }
        truncated: { type: boolean }
    AgentRecordDraftCommit:
      type: object
      additionalProperties: false
      required: [revision, approval_grant_id]
      properties:
        revision: { type: integer, minimum: 1 }
        approval_grant_id: { type: string, format: uuid, description: Ledger 用户会话批准精确内容后签发的一次性 Grant，不可由 Agent 自行签发 }
    AgentRecordCommitted:
      type: object
      additionalProperties: false
      required: [record_ref, state, revision, replayed, final_entry_created, receipt]
      properties:
        record_ref:
          type: string
          pattern: "^shadow://ledger/records/"
        state: { const: confirmed }
        revision: { type: integer, minimum: 2 }
        replayed: { type: boolean }
        final_entry_created: { const: true }
        receipt: { type: string, pattern: "^shadow://ledger/receipts/" }
    AgentRecordRejected:
      type: object
      additionalProperties: false
      required: [record_ref, state, replayed, receipt]
      properties:
        record_ref: { type: string, pattern: "^shadow://ledger/records/" }
        state: { const: rejected }
        replayed: { type: boolean }
        receipt: { type: string, pattern: "^shadow://ledger/receipts/" }
