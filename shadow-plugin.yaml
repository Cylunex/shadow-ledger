apiVersion: shadow.cylunex/v1alpha1
kind: ShadowDomainPlugin
metadata:
  id: shadow-ledger
  version: 1.0.1
  display_name: Shadow Ledger
  description: 以最小披露方式提供账目与预算读取，以及经用户审核的两阶段记账
spec:
  compatibility:
    shadow_plugin_api: v1alpha1
    dsh:
      distribution: ">=0.1.1-rc.2 <0.2.0"
      tools_api: ">=0.1.1-rc.2 <0.2.0"
  descriptors:
    agent: agent/manifest.yaml
    events: contracts/events.yaml
    resources: contracts/resources.yaml
    captures: contracts/captures.yaml
    confirmations: contracts/confirmations.yaml
    permissions: contracts/permissions.yaml
    surfaces: contracts/surfaces.yaml
