version: 2
app_id: ledger
package_version: 1.3.0
skills:
  - id: ledger-assistant
    path: skills/ledger-assistant/SKILL.md
    summary: 读取已授权账目与预算摘要，并创建等待 Ledger 用户审核的记账草案
    capabilities:
      - ledger.summary.read
      - ledger.records.read
      - ledger.budgets.read
      - ledger.records.draft
    invocation:
      model: true
      user: true
  - id: ledger-research
    path: skills/ledger-research/SKILL.md
    summary: 用确定性数字和查询凭证研究收支
    capabilities: [ledger.summary.read, ledger.records.read, ledger.budgets.read]
    invocation: {model: true, user: true}
  - id: ledger-capture
    path: skills/ledger-capture/SKILL.md
    summary: 解析并保存等待人工确认的金额草稿
    capabilities: [ledger.records.draft]
    invocation: {model: true, user: true}
  - id: ledger-steward
    path: skills/ledger-steward/SKILL.md
    summary: 整理待处理与建议而不执行事实修改
    capabilities: [ledger.records.read]
    invocation: {model: true, user: true}
capabilities:
  - id: ledger.summary.read
    summary: 读取已授权 Ledger 工作区中指定月份和币种的金额摘要
    audience: ledger
    scopes: [ledger.summary.read]
    tools:
      - name: ledger.summary.get
        transport: http
        contract_ref: contracts/agent.openapi.yaml
        operation_id: get_agent_summary
        exposure: on-demand
        result_mode: full
        max_result_bytes: 4096
        max_model_chars: 1200
        timeout_ms: 10000
        concurrency_safe: true
        retry_policy: idempotent
    effect: read
    data_classification: sensitive
    risk_level: L0
    confirmation: none
    reversible: true
    resource_grant_required: true
    idempotency_required: false
  - id: ledger.records.read
    summary: 读取已授权 Ledger 工作区中最小披露的确认账目列表
    audience: ledger
    scopes: [ledger.records.read]
    tools:
      - name: ledger.records.list
        transport: http
        contract_ref: contracts/agent.openapi.yaml
        operation_id: list_agent_records
        exposure: on-demand
        result_mode: full
        max_result_bytes: 65536
        max_model_chars: 12000
        timeout_ms: 10000
        concurrency_safe: true
        retry_policy: idempotent
    effect: read
    data_classification: sensitive
    risk_level: L0
    confirmation: none
    reversible: true
    resource_grant_required: true
    idempotency_required: false
  - id: ledger.budgets.read
    summary: 读取已授权 Ledger 工作区的月度预算目标与进度
    audience: ledger
    scopes: [ledger.budgets.read]
    tools:
      - name: ledger.budgets.list
        transport: http
        contract_ref: contracts/agent.openapi.yaml
        operation_id: list_agent_budgets
        exposure: on-demand
        result_mode: full
        max_result_bytes: 32768
        max_model_chars: 8000
        timeout_ms: 10000
        concurrency_safe: true
        retry_policy: idempotent
    effect: read
    data_classification: sensitive
    risk_level: L0
    confirmation: none
    reversible: true
    resource_grant_required: true
    idempotency_required: false
  - id: ledger.records.draft
    summary: 在已授权 Ledger 工作区创建可撤销且等待用户确认的记账草案
    audience: ledger
    scopes: [ledger.records.draft]
    tools:
      - name: ledger.records.draft
        transport: http
        contract_ref: contracts/agent.openapi.yaml
        operation_id: create_agent_record_draft
        exposure: on-demand
        result_mode: full
        max_result_bytes: 4096
        max_model_chars: 1200
        timeout_ms: 15000
        concurrency_safe: false
        retry_policy: idempotent
      - name: ledger.nexus.review.create
        transport: http
        contract_ref: contracts/agent.openapi.yaml
        operation_id: create_nexus_ledger_review
        exposure: hidden
        result_mode: reference
        max_result_bytes: 8192
        max_model_chars: 1200
        timeout_ms: 15000
        concurrency_safe: false
        retry_policy: idempotent
    effect: draft
    data_classification: sensitive
    risk_level: L1
    confirmation: notify
    reversible: true
    resource_grant_required: true
    idempotency_required: true
  - id: ledger.records.write
    summary: 在用户于 Nexus 审核确认后提交同一条 Agent 记账草案
    audience: ledger
    scopes: [ledger.records.write]
    tools:
      - name: ledger.records.commit
        transport: http
        contract_ref: contracts/agent.openapi.yaml
        operation_id: commit_agent_record_draft
        exposure: hidden
        result_mode: full
        max_result_bytes: 4096
        max_model_chars: 1200
        timeout_ms: 15000
        concurrency_safe: false
        retry_policy: idempotent
      - name: ledger.records.pending
        transport: http
        contract_ref: contracts/agent.openapi.yaml
        operation_id: list_agent_record_drafts
        exposure: hidden
        result_mode: full
        max_result_bytes: 262144
        max_model_chars: 1200
        timeout_ms: 15000
        concurrency_safe: true
        retry_policy: idempotent
      - name: ledger.records.reject
        transport: http
        contract_ref: contracts/agent.openapi.yaml
        operation_id: reject_agent_record_draft
        exposure: hidden
        result_mode: full
        max_result_bytes: 4096
        max_model_chars: 1200
        timeout_ms: 15000
        concurrency_safe: false
        retry_policy: idempotent
      - name: ledger.nexus.review.list
        transport: http
        contract_ref: contracts/agent.openapi.yaml
        operation_id: list_nexus_ledger_reviews
        exposure: hidden
        result_mode: reference
        max_result_bytes: 262144
        max_model_chars: 1200
        timeout_ms: 15000
        concurrency_safe: true
        retry_policy: idempotent
      - name: ledger.nexus.review.commit
        transport: http
        contract_ref: contracts/agent.openapi.yaml
        operation_id: commit_nexus_ledger_review
        exposure: hidden
        result_mode: reference
        max_result_bytes: 8192
        max_model_chars: 1200
        timeout_ms: 15000
        concurrency_safe: false
        retry_policy: idempotent
      - name: ledger.nexus.review.reject
        transport: http
        contract_ref: contracts/agent.openapi.yaml
        operation_id: reject_nexus_ledger_review
        exposure: hidden
        result_mode: reference
        max_result_bytes: 8192
        max_model_chars: 1200
        timeout_ms: 15000
        concurrency_safe: false
        retry_policy: idempotent
    effect: write
    data_classification: sensitive
    risk_level: L2
    confirmation: policy
    reversible: true
    resource_grant_required: true
    idempotency_required: true
